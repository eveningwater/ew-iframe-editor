name: Deploy Examples

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm build

      # 站点结构保持与本地开发一致：examples/ 与 dist/ 同级，
      # HTML 里的 ../dist/index.global.js 相对引用才能正确解析
      - name: Prepare site
        run: |
          mkdir -p .gh-pages
          cp -r examples .gh-pages/examples
          cp -r dist .gh-pages/dist
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=./examples/"><title>ew-iframe-editor</title></head></html>' > .gh-pages/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .gh-pages
