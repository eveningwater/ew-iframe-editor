<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JDoodle 自定义适配器示例</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .info { padding: 12px 20px; background: #f5f5f5; border-bottom: 1px solid #ddd; font-size: 14px; }
    .info code { background: #e0e0e0; padding: 2px 6px; border-radius: 4px; }
    .warn { padding: 12px 20px; background: #fff3cd; border-bottom: 1px solid #ffeaa7; font-size: 14px; color: #856404; }
  </style>
</head>
<body>
  <div class="info">
    JDoodle 自定义适配器示例 — 实现 <code>EditorAdapter</code> 接口接入 JDoodle（支持 70+ 语言）
  </div>
  <div class="warn">
    ⚠️ JDoodle 需要先在 <a href="https://www.jdoodle.com" target="_blank">jdoodle.com</a> 创建 embed 获取 embed_key，替换下方的 <code>YOUR_EMBED_KEY</code>
  </div>

  <script src="../dist/index.global.js"></script>
  <script>
    const { createEditor } = EwIframeEditor;

    /**
     * JDoodle 自定义适配器
     * 文档: https://www.jdoodle.com/docs/embeds/drive-it-from-your-page
     *
     * 注入方式: postMessage 命令
     * 需要先等 embed 发送 ready 事件，再发送 setCode 命令
     *
     * 注意: JDoodle embed 需要通过 pym.js 创建，URL 格式为
     * https://www.jdoodle.com/embed/v1/{embed_key}
     */
    function jDoodleAdapter(embedKey, language = 'javascript') {
      return {
        name: 'jdoodle',
        usesPostMessage: true,

        getUrl() {
          return `https://www.jdoodle.com/embed/v1/${embedKey}`;
        },

        sendCode(iframe, code) {
          const content = code.js || code.html || '';
          // JDoodle 通过 postMessage 发送命令
          iframe.contentWindow?.postMessage({
            command: 'setCode',
            script: content,
          }, '*');
        },
      };
    }

    // 使用自定义适配器（替换 YOUR_EMBED_KEY 为你自己的 embed key）
    createEditor({
      adapter: jDoodleAdapter('YOUR_EMBED_KEY', 'javascript'),
      code: {
        js: `// JDoodle 示例
function greet(name) {
  return 'Hello, ' + name + '!';
}
console.log(greet('JDoodle'));`,
      },
    });
  </script>
</body>
</html>
